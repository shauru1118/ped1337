services:
  web:
    build: .
    image: ped1337:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      TEMP_DIR_PATH: /app/temp
      KEY_FILE_PATH: /app/data/key.key
      RUN_TELEGRAM_BOT: ${RUN_TELEGRAM_BOT:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      CLEANUP_MAX_AGE_SECONDS: ${CLEANUP_MAX_AGE_SECONDS:-300}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-60}
    volumes:
      - app-data:/app/data
      - app-temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    profiles: ["bot"]
    build: .
    image: ped1337:latest
    command: ["python", "-m", "bot"]
    environment:
      TEMP_DIR_PATH: /app/temp
      KEY_FILE_PATH: /app/data/key.key
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
    volumes:
      - app-data:/app/data
      - app-temp:/app/temp
    restart: unless-stopped

volumes:
  app-data:
  app-temp:
